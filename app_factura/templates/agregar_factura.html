<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Factura</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 400px; }
        label { display: block; margin: 10px 0 5px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { background-color: #007BFF; color: white; padding: 10px 15px; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>Agregar Factura</h1>
    <form method="post">
        {% csrf_token %}
        <label>Factura:</label>
        <input type="text" name="factura" required>

        <label>Fecha:</label>
        <input type="date" name="fecha" required>

        <label>Monto:</label>
        <input type="number" step="0.01" name="monto" required>

        <label>Método de Pago:</label>
        <input type="text" name="metodo_pago" required>

        <label>Cliente ID:</label>
        <input type="number" name="cliente_id_cliente" required>

        <label>Proyecto ID:</label>
        <input type="number" name="proyecto_id_proyecto" required>

        <button type="submit">Guardar</button>
    </form>
    <a href="/">Volver al listado</a>
</body>
</html>
